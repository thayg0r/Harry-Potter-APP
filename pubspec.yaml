name: hp_app
description: "Harry Potter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # =========================
  # LOCALIZATION (MULTI-LANGUAGE)
  # =========================
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.2.2

  # iOS style icons
  cupertino_icons: ^1.0.8

  # =========================
  # STATE MANAGEMENT
  # =========================
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # =========================
  # NETWORK
  # =========================
  dio: ^5.4.0

  # =========================
  # UI / IMAGES
  # =========================
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 🔑 NECESSÁRIO PARA GERAR O AppLocalizations
  generate: true

  # =========================
  # ASSETS
  # =========================
  assets:
    - assets/images/

  # =========================
  # FONTS (Harry Potter)
  # =========================
  fonts:
    - family: HarryP
      fonts:
        - asset: assets/fonts/HarryP-Regular.ttf
